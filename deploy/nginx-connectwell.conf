# ConnectWell reverse proxy — paste INSIDE your site's HTTPS server block,
# typically /etc/nginx/sites-available/<your-domain>.
# The `^~` modifier makes this prefix win over the regex css/js/image locations
# regardless of where it sits in the block, so position does not matter.
#
# deploy/setup-server.sudo.sh inserts this for you on a standard layout.

location ^~ /connectwell/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_max_body_size 210m;
}

location = /connectwell {
    return 301 /connectwell/;
}
