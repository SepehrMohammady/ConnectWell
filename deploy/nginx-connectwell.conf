# ConnectWell reverse proxy — add INSIDE the example.com HTTPS server block,
# BEFORE the regex locations (css/js/images). The ^~ modifier makes this prefix
# match win over those regex locations.
#
# File: /etc/nginx/sites-available/example.com

location ^~ /connectwell/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_max_body_size 200m;
}

location = /connectwell {
    return 301 /connectwell/;
}
