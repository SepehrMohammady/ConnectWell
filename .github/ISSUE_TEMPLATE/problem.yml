name: Problem
description: Something in ConnectWell doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Please leave out other people's names and messages.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ConnectWell version
      description: At the bottom of the conversation list, or on the sign-in page.
  - type: dropdown
    id: where
    attributes:
      label: Where you use it
      options:
        - In a browser
        - The web app installed from a browser
        - The Android app
        - The Windows app
        - The server itself
  - type: input
    id: device
    attributes:
      label: Browser and device
      description: For example Chrome on a Pixel 8 with Android 15, or Edge on Windows 11.
  - type: textarea
    id: more
    attributes:
      label: Screenshots or anything else
      description: For calls, the network at each end (the same Wi-Fi, mobile data, a VPN). For the server, its operating system, Node version and any errors in its log.
